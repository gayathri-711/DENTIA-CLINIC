<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Portals Sign In - MEDINOVA</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="fonts/fontawesome6/css/all.min.css">
    <link rel="stylesheet" href="css/medinova-theme.css">
</head>
<body class="bg-light">

<div class="py-5">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-8">
                <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <div class="med-logo-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 26px;">
                            <i class="fa fa-heart-pulse"></i>
                        </div>
                        <h3 class="fw-bold text-primary mb-1">Hospital Portals Sign In</h3>
                        <p class="text-muted small">Select your clinical or administrative role below</p>
                    </div>

                    <form id="loginForm" onsubmit="handleLogin(event)">
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">Hospital Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa fa-envelope text-muted"></i></span>
                                <input type="email" id="loginEmail" class="form-control border-start-0" placeholder="name@medinova.com" value="admin@medinova.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <div class="d-flex justify-content-between">
                                <label class="form-label fw-bold small text-muted">Password</label>
                                <a href="#" class="small text-decoration-none" onclick="alert('Demo password is: medinova123'); return false;">Forgot?</a>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa fa-lock text-muted"></i></span>
                                <input type="password" id="loginPassword" class="form-control border-start-0" placeholder="••••••••" value="medinova123" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-med-primary w-100 py-3 fw-bold rounded-3 mb-3">
                            <i class="fa fa-arrow-right-to-bracket me-2"></i> Sign In to Portal
                        </button>

                        <div class="text-center mb-3">
                            <a href="index.html" class="text-muted small text-decoration-none"><i class="fa fa-arrow-left me-1"></i> Back to Homepage</a>
                        </div>
                    </form>

                    <!-- 1-Click Fast Demo Logins for Evaluator -->
                    <div class="mt-4 pt-4 border-top">
                        <small class="text-muted fw-bold d-block text-uppercase mb-2 text-center" style="font-size: 11px;">1-Click Role Portals (Instant Fill & Jump)</small>
                        <div class="row g-2">
                            <div class="col-6">
                                <a href="admin/index.html" class="btn btn-sm btn-outline-primary w-100 text-truncate">
                                    <i class="fa fa-gauge me-1"></i> Admin Portal
                                </a>
                            </div>
                            <div class="col-6">
                                <a href="patient-dashboard.html" class="btn btn-sm btn-outline-primary w-100 text-truncate">
                                    <i class="fa fa-user me-1"></i> Patient Portal
                                </a>
                            </div>
                            <div class="col-6">
                                <button type="button" class="btn btn-sm btn-outline-primary w-100 text-truncate" onclick="fillDemo('cardiology@medinova.com', 'medinova123', 'doctor')">
                                    <i class="fa fa-user-doctor me-1"></i> Doctor Portal
                                </button>
                            </div>
                            <div class="col-6">
                                <button type="button" class="btn btn-sm btn-outline-primary w-100 text-truncate" onclick="fillDemo('reception@medinova.com', 'medinova123', 'reception')">
                                    <i class="fa fa-id-card me-1"></i> Reception Desk
                                </button>
                            </div>
                            <div class="col-6">
                                <button type="button" class="btn btn-sm btn-outline-primary w-100 text-truncate" onclick="fillDemo('nurse@medinova.com', 'medinova123', 'nurse')">
                                    <i class="fa fa-user-nurse me-1"></i> Nursing Station
                                </button>
                            </div>
                            <div class="col-6">
                                <button type="button" class="btn btn-sm btn-outline-primary w-100 text-truncate" onclick="fillDemo('lab@medinova.com', 'medinova123', 'lab')">
                                    <i class="fa fa-flask me-1"></i> Diagnostic Lab
                                </button>
                            </div>
                            <div class="col-6">
                                <button type="button" class="btn btn-sm btn-outline-primary w-100 text-truncate" onclick="fillDemo('pharmacy@medinova.com', 'medinova123', 'pharmacy')">
                                    <i class="fa fa-pills me-1"></i> Pharmacy
                                </button>
                            </div>
                            <div class="col-6">
                                <button type="button" class="btn btn-sm btn-outline-primary w-100 text-truncate" onclick="fillDemo('billing@medinova.com', 'medinova123', 'billing')">
                                    <i class="fa fa-file-invoice me-1"></i> Billing & Cashier
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillDemo(email, pass, role) {
    document.getElementById('loginEmail').value = email;
    document.getElementById('loginPassword').value = pass;
    if (role === 'admin') window.location.href = 'admin/index.html';
    else if (role === 'patient') window.location.href = 'patient-dashboard.html';
    else if (role === 'doctor') window.location.href = 'doctor/index.php';
    else if (role === 'reception') window.location.href = 'receptionist/index.php';
    else if (role === 'nurse') window.location.href = 'nurse/index.php';
    else if (role === 'lab') window.location.href = 'laboratory/index.php';
    else if (role === 'pharmacy') window.location.href = 'pharmacy/index.php';
    else if (role === 'billing') window.location.href = 'billing/index.php';
}

function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    if (email.includes('admin')) window.location.href = 'admin/index.html';
    else window.location.href = 'patient-dashboard.html';
}
</script>
</body>
</html>
