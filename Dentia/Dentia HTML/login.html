<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Sign In — Doctor Dental Clinic Dentia</title>
    <link href="css/bootstrap.min.css" rel="stylesheet" type="text/css">
    <link href="css/plugins.css" rel="stylesheet" type="text/css">
    <link href="css/style.css" rel="stylesheet" type="text/css">
    <link href="css/custom-modern.css" rel="stylesheet" type="text/css">
    <link rel="icon" href="images/icon.webp" type="image/gif">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden bg-white">
                    <div class="card-header bg-primary text-white p-4 text-center">
                        <a href="index.html">
                            <img src="images/logo-white.webp" alt="Dentia" class="mb-2" style="max-height: 42px;">
                        </a>
                        <h4 class="fw-bold text-white mb-0">Patient Account Sign In</h4>
                        <p class="small text-white-50 mb-0">Access your scheduled dental visits & medical appointments</p>
                    </div>

                    <div class="card-body p-4 p-md-5">
                        
                        <div id="login_alert" class="alert d-none rounded-3 mb-4 shadow-sm"></div>

                        <form id="patient_login_form" onsubmit="handlePatientLogin(event)">
                            <div class="mb-3">
                                <label class="form-label fw-semibold small">Registered Email Address</label>
                                <input type="email" id="login_email" class="form-control rounded-3 py-2" placeholder="name@example.com" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold small">Account Password</label>
                                <input type="password" id="login_password" class="form-control rounded-3 py-2" placeholder="••••••••" required>
                            </div>

                            <button type="submit" id="btn_submit" class="btn btn-primary btn-lg rounded-pill w-100 fw-bold shadow mb-3">
                                <i class="fa fa-unlock-alt me-2"></i> Access Patient Portal
                            </button>
                        </form>

                        <div class="bg-light p-3 rounded-3 text-center border mb-3">
                            <div class="small text-muted mb-2">Want to test with sample patient?</div>
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill" onclick="fillSamplePatient()">
                                <i class="fa fa-magic me-1"></i> Quick Fill: John Doe (Demo)
                            </button>
                        </div>

                        <div class="text-center pt-3 border-top">
                            <p class="text-muted small mb-2">
                                New patient? <a href="register.html" class="text-primary fw-bold text-decoration-none">Create an Account</a>
                            </p>
                            <p class="text-muted small mb-0">
                                Clinic Staff? <a href="admin/index.html" class="text-secondary fw-semibold text-decoration-none"><i class="fa fa-shield me-1"></i> Admin Portal</a>
                            </p>
                        </div>

                    </div>
                </div>

                <div class="text-center mt-3">
                    <a href="index.html" class="text-muted small text-decoration-none"><i class="fa fa-arrow-left me-1"></i> Return to Homepage</a>
                </div>

            </div>
        </div>
    </div>

<script>
function fillSamplePatient() {
    document.getElementById('login_email').value = 'john.doe@example.com';
    document.getElementById('login_password').value = 'patient123';
}

async function handlePatientLogin(e) {
    e.preventDefault();
    const alertEl = document.getElementById('login_alert');
    const submitBtn = document.getElementById('btn_submit');
    const email = document.getElementById('login_email').value.trim();
    const pass = document.getElementById('login_password').value;

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fa fa-spinner fa-spin me-2"></i> Signing In...';

    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, password: pass })
        }).then(r => r.json());

        if (res.success) {
            localStorage.setItem('dentia_patient', JSON.stringify(res.patient));
            alertEl.className = 'alert alert-success rounded-3 mb-4';
            alertEl.innerHTML = `<i class="fa fa-check-circle me-2"></i> Welcome back, ${res.patient.name}! Redirecting to dashboard...`;
            setTimeout(() => {
                window.location.href = 'patient-dashboard.html';
            }, 800);
        } else {
            alertEl.className = 'alert alert-danger rounded-3 mb-4';
            alertEl.innerHTML = `<i class="fa fa-exclamation-circle me-2"></i> ${res.message || 'Invalid credentials'}`;
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa fa-unlock-alt me-2"></i> Access Patient Portal';
        }
    } catch (err) {
        alertEl.className = 'alert alert-danger rounded-3 mb-4';
        alertEl.innerHTML = '<i class="fa fa-exclamation-circle me-2"></i> Server communication error. Please try again.';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa fa-unlock-alt me-2"></i> Access Patient Portal';
    }
}
</script>
</body>
</html>
