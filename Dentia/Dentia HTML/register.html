<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration - MEDINOVA Multi-Speciality Hospital</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- CSS Frameworks -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="fonts/fontawesome6/css/all.min.css">
    <link rel="stylesheet" href="css/plugins.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/medinova-theme.css">
</head>
<body class="bg-light min-vh-100 d-flex flex-column justify-content-between py-4">

<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="text-center mb-4">
                <a href="index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none">
                    <div class="med-logo-icon" style="width: 48px; height: 48px; font-size: 22px;">
                        <i class="fa fa-heart-pulse"></i>
                    </div>
                    <div class="text-start">
                        <div class="med-logo-text fs-4 text-primary">MEDINOVA</div>
                        <div class="med-logo-tagline text-secondary small">Advanced Healthcare</div>
                    </div>
                </a>
            </div>

            <div class="card border-0 shadow-lg rounded-4 overflow-hidden bg-white">
                <div class="card-header bg-primary text-white p-4 text-center">
                    <h4 class="fw-bold text-white mb-1"><i class="fa fa-user-plus me-2"></i> Create Patient Account</h4>
                    <p class="small text-white-50 mb-0">Register for personalized electronic health records & rapid appointment booking</p>
                </div>

                <div class="card-body p-4 p-md-5">
                    <div id="reg_alert" class="alert d-none rounded-3 mb-4 shadow-sm"></div>

                    <form id="patient_register_form" onsubmit="handlePatientRegister(event)">
                        <div class="row g-3 mb-3">
                            <div class="col-12">
                                <label class="form-label fw-bold small text-muted">Full Legal Name *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fa fa-user text-muted"></i></span>
                                    <input type="text" id="reg_name" class="form-control border-start-0" placeholder="e.g. John Doe" required>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold small text-muted">Email Address *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fa fa-envelope text-muted"></i></span>
                                    <input type="email" id="reg_email" class="form-control border-start-0" placeholder="name@example.com" required>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold small text-muted">Phone Number *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fa fa-phone text-muted"></i></span>
                                    <input type="tel" id="reg_phone" class="form-control border-start-0" placeholder="+1 (555) 000-0000" required>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold small text-muted">Date of Birth *</label>
                                <input type="date" id="reg_dob" class="form-control" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold small text-muted">Blood Group</label>
                                <select id="reg_blood" class="form-select">
                                    <option value="O+">O Positive (O+)</option>
                                    <option value="O-">O Negative (O-)</option>
                                    <option value="A+">A Positive (A+)</option>
                                    <option value="A-">A Negative (A-)</option>
                                    <option value="B+">B Positive (B+)</option>
                                    <option value="B-">B Negative (B-)</option>
                                    <option value="AB+">AB Positive (AB+)</option>
                                    <option value="AB-">AB Negative (AB-)</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-bold small text-muted">Residential Address</label>
                                <input type="text" id="reg_address" class="form-control" placeholder="Street, Apt, City, State, ZIP">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold small text-muted">Create Password *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fa fa-lock text-muted"></i></span>
                                    <input type="password" id="reg_password" class="form-control border-start-0" placeholder="••••••••" minlength="6" required>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold small text-muted">Confirm Password *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fa fa-lock-open text-muted"></i></span>
                                    <input type="password" id="reg_confirm_password" class="form-control border-start-0" placeholder="••••••••" minlength="6" required>
                                </div>
                            </div>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="termsCheck" required checked>
                            <label class="form-check-label small text-muted" for="termsCheck">
                                I consent to electronic medical records retention compliant with HIPAA standards.
                            </label>
                        </div>

                        <button type="submit" id="btn_submit" class="btn btn-med-primary w-100 py-3 fw-bold rounded-pill mb-3">
                            <i class="fa fa-user-check me-2"></i> Complete Patient Registration
                        </button>
                    </form>

                    <div class="text-center pt-2 border-top">
                        <small class="text-muted">Already registered with MEDINOVA? <a href="login.html" class="fw-bold text-primary text-decoration-none">Sign In to Portal</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="text-center py-3">
    <small class="text-muted">&copy; 2026 <strong>MEDINOVA Multi-Speciality Hospital</strong> &bull; Secure Patient Portal &bull; <a href="index.html" class="text-decoration-none">Return to Main</a></small>
</footer>

<script>
function handlePatientRegister(e) {
    e.preventDefault();
    const p1 = document.getElementById('reg_password').value;
    const p2 = document.getElementById('reg_confirm_password').value;
    const alertBox = document.getElementById('reg_alert');

    if (p1 !== p2) {
        alertBox.className = "alert alert-danger rounded-3 mb-4 shadow-sm";
        alertBox.innerText = "Passwords do not match. Please re-enter.";
        alertBox.classList.remove('d-none');
        return;
    }

    const name = document.getElementById('reg_name').value;
    alertBox.className = "alert alert-success rounded-3 mb-4 shadow-sm";
    alertBox.innerHTML = `<strong>Registration Successful!</strong> Welcome to MEDINOVA, ${name}. Directing to your Patient Portal...`;
    alertBox.classList.remove('d-none');

    setTimeout(() => {
        window.location.href = "patient/dashboard.html";
    }, 1200);
}
</script>
</body>
</html>
