<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration — Doctor Dental Clinic Dentia</title>
    <link href="css/bootstrap.min.css" rel="stylesheet" type="text/css">
    <link href="css/plugins.css" rel="stylesheet" type="text/css">
    <link href="css/style.css" rel="stylesheet" type="text/css">
    <link href="css/custom-modern.css" rel="stylesheet" type="text/css">
    <link rel="icon" href="images/icon.webp" type="image/gif">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden bg-white">
                    <div class="card-header bg-primary text-white p-4 text-center">
                        <a href="index.html">
                            <img src="images/logo-white.webp" alt="Dentia" class="mb-2" style="max-height: 42px;">
                        </a>
                        <h4 class="fw-bold text-white mb-0">Create Patient Account</h4>
                        <p class="small text-white-50 mb-0">Register to schedule and manage your dental appointments</p>
                    </div>

                    <div class="card-body p-4 p-md-5">
                        
                        <div id="reg_alert" class="alert d-none rounded-3 mb-4 shadow-sm"></div>

                        <form id="patient_register_form" onsubmit="handlePatientRegister(event)">
                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label fw-semibold small">Full Legal Name *</label>
                                    <input type="text" id="reg_name" class="form-control rounded-3" placeholder="e.g. Sarah Jenkins" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small">Email Address *</label>
                                    <input type="email" id="reg_email" class="form-control rounded-3" placeholder="name@example.com" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small">Phone Number *</label>
                                    <input type="tel" id="reg_phone" class="form-control rounded-3" placeholder="+1 (555) 000-0000" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small">Password (Min 6 chars) *</label>
                                    <input type="password" id="reg_password" class="form-control rounded-3" placeholder="••••••••" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small">Confirm Password *</label>
                                    <input type="password" id="reg_confirm" class="form-control rounded-3" placeholder="••••••••" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small">Date of Birth</label>
                                    <input type="date" id="reg_dob" class="form-control rounded-3">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small">Gender</label>
                                    <select id="reg_gender" class="form-select rounded-3">
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-semibold small">Home Address</label>
                                    <input type="text" id="reg_address" class="form-control rounded-3" placeholder="Street, City, State, ZIP">
                                </div>

                                <div class="col-12 mt-4">
                                    <button type="submit" id="btn_reg_submit" class="btn btn-primary btn-lg rounded-pill w-100 fw-bold shadow">
                                        <i class="fa fa-user-plus me-2"></i> Register Account
                                    </button>
                                </div>
                            </div>
                        </form>

                        <div class="text-center pt-3 border-top mt-4">
                            <p class="text-muted small mb-0">
                                Already registered? <a href="login.html" class="text-primary fw-bold text-decoration-none">Sign In to Account</a>
                            </p>
                        </div>

                    </div>
                </div>

                <div class="text-center mt-3">
                    <a href="index.html" class="text-muted small text-decoration-none"><i class="fa fa-arrow-left me-1"></i> Return to Homepage</a>
                </div>

            </div>
        </div>
    </div>

<script>
async function handlePatientRegister(e) {
    e.preventDefault();
    const alertEl = document.getElementById('reg_alert');
    const submitBtn = document.getElementById('btn_reg_submit');

    const name = document.getElementById('reg_name').value.trim();
    const email = document.getElementById('reg_email').value.trim();
    const phone = document.getElementById('reg_phone').value.trim();
    const pass = document.getElementById('reg_password').value;
    const confirm = document.getElementById('reg_confirm').value;
    const dob = document.getElementById('reg_dob').value;
    const gender = document.getElementById('reg_gender').value;
    const address = document.getElementById('reg_address').value.trim();

    if (pass.length < 6) {
        alertEl.className = 'alert alert-danger rounded-3 mb-4';
        alertEl.innerHTML = '<i class="fa fa-exclamation-circle me-2"></i> Password must be at least 6 characters.';
        return;
    }
    if (pass !== confirm) {
        alertEl.className = 'alert alert-danger rounded-3 mb-4';
        alertEl.innerHTML = '<i class="fa fa-exclamation-circle me-2"></i> Passwords do not match.';
        return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fa fa-spinner fa-spin me-2"></i> Creating Account...';

    try {
        const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name, email, phone, password: pass, dob, gender, address
            })
        }).then(r => r.json());

        if (res.success) {
            localStorage.setItem('dentia_patient', JSON.stringify(res.patient));
            alertEl.className = 'alert alert-success rounded-3 mb-4';
            alertEl.innerHTML = `<i class="fa fa-check-circle me-2"></i> Registration successful, ${name}! Taking you to your dashboard...`;
            setTimeout(() => {
                window.location.href = 'patient-dashboard.html';
            }, 800);
        } else {
            alertEl.className = 'alert alert-danger rounded-3 mb-4';
            alertEl.innerHTML = `<i class="fa fa-exclamation-circle me-2"></i> ${res.message || 'Registration failed'}`;
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa fa-user-plus me-2"></i> Register Account';
        }
    } catch (err) {
        alertEl.className = 'alert alert-danger rounded-3 mb-4';
        alertEl.innerHTML = '<i class="fa fa-exclamation-circle me-2"></i> Server communication error. Please try again.';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa fa-user-plus me-2"></i> Register Account';
    }
}
</script>
</body>
</html>
