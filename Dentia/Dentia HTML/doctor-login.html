<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Portal Login — Doctor Dental Clinic Dentia</title>
    <link href="css/bootstrap.min.css" rel="stylesheet" type="text/css">
    <link href="css/plugins.css" rel="stylesheet" type="text/css">
    <link href="css/style.css" rel="stylesheet" type="text/css">
    <link href="css/custom-modern.css" rel="stylesheet" type="text/css">
    <link rel="icon" href="images/icon.webp" type="image/gif">
    <style>
        body {
            background: linear-gradient(135deg, #0a3d62 0%, #1e5f74 50%, #133b5c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            padding: 20px;
        }
        .doctor-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            max-width: 480px;
            width: 100%;
            overflow: hidden;
        }
        .doctor-card-header {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            color: white;
            padding: 35px 30px;
            text-align: center;
        }
        .doctor-icon-badge {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 15px;
            border: 2px solid rgba(255,255,255,0.4);
        }
        .form-control {
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #dee2e6;
        }
        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
        }
        .quick-doc-btn {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 8px 12px;
            text-align: left;
            transition: all 0.2s;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .quick-doc-btn:hover {
            background: #eff6ff;
            border-color: #3b82f6;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="doctor-card">
        <div class="doctor-card-header">
            <div class="doctor-icon-badge">
                <i class="fa fa-user-md"></i>
            </div>
            <h3 class="fw-bold text-white mb-1">Doctor Portal</h3>
            <p class="text-white-50 mb-0 small">Secure Clinic Access for Dentists & Specialists</p>
        </div>

        <div class="p-4 p-md-5">
            <div id="login_alert" class="alert d-none rounded-3 small mb-4"></div>

            <form id="doctor_login_form" onsubmit="handleDoctorLogin(event)">
                <div class="mb-3">
                    <label class="form-label fw-semibold small text-muted">Doctor Clinic Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa fa-envelope-o text-primary"></i></span>
                        <input type="email" id="doc_email" class="form-control border-start-0" placeholder="sarah.bennett@dentiacare.com" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold small text-muted">Doctor Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa fa-lock text-primary"></i></span>
                        <input type="password" id="doc_password" class="form-control border-start-0" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" id="doc_login_btn" class="btn btn-primary w-100 py-3 rounded-pill fw-bold shadow-sm mb-3">
                    <i class="fa fa-sign-in me-2"></i> Log In to Doctor Dashboard
                </button>
            </form>

            <div class="alert alert-info py-2 px-3 rounded-3 small mb-4">
                <i class="fa fa-shield me-1"></i> <strong>Admin-Controlled:</strong> Doctor login credentials can only be created & enabled by the clinic administrator.
            </div>

            <!-- Quick Demo Doctor Selectors -->
            <div class="pt-3 border-top">
                <div class="text-muted small fw-semibold mb-2">Demo Doctor Accounts (Click to Auto-Fill):</div>
                
                <button type="button" class="quick-doc-btn" onclick="fillDoctor('sarah.bennett@dentiacare.com', 'doctor123')">
                    <img src="images/team/1.webp" style="width:34px; height:34px; border-radius:50%; object-fit:cover;">
                    <div>
                        <div class="fw-bold small text-dark">Dr. Sarah Bennett</div>
                        <div class="text-muted" style="font-size: 11px;">Lead Dentist & General Care &bull; Login Enabled</div>
                    </div>
                </button>

                <button type="button" class="quick-doc-btn" onclick="fillDoctor('maya.lin@dentiacare.com', 'doctor123')">
                    <img src="images/team/2.webp" style="width:34px; height:34px; border-radius:50%; object-fit:cover;">
                    <div>
                        <div class="fw-bold small text-dark">Dr. Maya Lin</div>
                        <div class="text-muted" style="font-size: 11px;">Cosmetic & Aesthetic Dentistry &bull; Login Enabled</div>
                    </div>
                </button>

                <button type="button" class="quick-doc-btn" onclick="fillDoctor('alexander.vance@dentiacare.com', 'doctor123')">
                    <img src="images/team/1.webp" style="width:34px; height:34px; border-radius:50%; object-fit:cover;">
                    <div>
                        <div class="fw-bold small text-dark">Dr. Alexander Vance (Test Block)</div>
                        <div class="text-danger" style="font-size: 11px;"><i class="fa fa-lock"></i> No Admin Login Access Yet (Shows Block)</div>
                    </div>
                </button>
            </div>

            <div class="text-center mt-4">
                <a href="index.html" class="text-decoration-none small text-muted me-3"><i class="fa fa-home me-1"></i> Home</a>
                <a href="admin/index.html" class="text-decoration-none small text-muted me-3"><i class="fa fa-shield me-1"></i> Admin Portal</a>
                <a href="login.html" class="text-decoration-none small text-muted"><i class="fa fa-user me-1"></i> Patient Login</a>
            </div>

        </div>
    </div>

<script>
function fillDoctor(email, pass) {
    document.getElementById('doc_email').value = email;
    document.getElementById('doc_password').value = pass;
}

async function handleDoctorLogin(e) {
    e.preventDefault();
    const alertBox = document.getElementById('login_alert');
    const submitBtn = document.getElementById('doc_login_btn');
    const email = document.getElementById('doc_email').value.trim();
    const password = document.getElementById('doc_password').value.trim();

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fa fa-spinner fa-spin me-2"></i> Verifying Credentials...';
    alertBox.className = 'alert d-none';

    try {
        const res = await fetch('/api/doctor/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, password: password })
        }).then(r => r.json());

        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa fa-sign-in me-2"></i> Log In to Doctor Dashboard';

        if (res.success) {
            // Save doctor session
            localStorage.setItem('dentia_doctor', JSON.stringify(res.doctor));
            alertBox.className = 'alert alert-success d-block';
            alertBox.innerHTML = `<i class="fa fa-check-circle me-2"></i> Login successful! Redirecting to Doctor Dashboard...`;
            setTimeout(() => {
                window.location.href = 'doctor-dashboard.html';
            }, 1000);
        } else {
            alertBox.className = 'alert alert-danger d-block';
            alertBox.innerHTML = `<i class="fa fa-exclamation-triangle me-2"></i> ${res.message || 'Login failed.'}`;
        }
    } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa fa-sign-in me-2"></i> Log In to Doctor Dashboard';
        alertBox.className = 'alert alert-danger d-block';
        alertBox.innerHTML = `<i class="fa fa-times-circle me-2"></i> Server communication error.`;
    }
}
</script>
</body>
</html>
